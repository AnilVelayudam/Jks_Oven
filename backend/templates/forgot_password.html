{% extends "base.html" %}
{% block content %}

<div class="auth-container">
    <div class="auth-box">

        <h2>Forgot Password 🔑</h2>

        <form method="post">
            {% csrf_token %}

            <div class="input-group">
                <label>Email</label>
                <input type="email" name="email" placeholder="Enter your email" required>
            </div>

            <button class="auth-btn">Send Reset Link</button>
        </form>

    </div>
</div>

{% endblock %}
