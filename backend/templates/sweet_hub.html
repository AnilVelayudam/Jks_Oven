{% extends 'base.html' %}
{% block content %}

<div class="sweet-wrapper">

<h1 class="sweet-title">Sweet Hub 🍪</h1>

<!-- Category Section -->
<div class="category-grid">

<a href="{% url 'category_products' 'cake' %}" class="category-card">
    <img src="/static/images/cake_category.jpg">
    <h3>Cakes</h3>
</a>

<a href="{% url 'category_products' 'cookie' %}" class="category-card">
    <img src="/static/images/cookie_category.jpg">
    <h3>Cookies</h3>
</a>

<a href="{% url 'category_products' 'icecream' %}" class="category-card">
    <img src="/static/images/icecream_category.jpg">
    <h3>Ice Cream</h3>
</a>

<a href="{% url 'category_products' 'sweet' %}" class="category-card">
    <img src="/static/images/sweet_category.jpg">
    <h3>Sweets</h3>
</a>

</div>

<!-- Product Section -->
{% if products %}

<h2 class="section-heading">All Products</h2>

<div class="product-grid">

{% for product in products %}
    {% include "components/product_card.html" %}
{% endfor %}

</div>

{% else %}
<p>No products found.</p>
{% endif %}

</div>

{% endblock %}
