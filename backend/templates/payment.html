<!DOCTYPE html>
<html>
<head>
    <title>Payment</title>
</head>
<body>

<h2>Complete Payment</h2>

<button id="pay-btn">Pay Now</button>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
var options = {
    "key": "{{ razorpay_key }}",
    "amount": "{{ payment.amount }}",
    "currency": "INR",
    "name": "JKS Oven",
    "description": "Order Payment",
    "order_id": "{{ payment.id }}",

    // ✅ PAYMENT SUCCESS
    "handler": function (response) {

        // 🔥 SHOW LOADING SCREEN (FIX DELAY ISSUE)
        document.body.innerHTML = `
            <div style="
                height:100vh;
                display:flex;
                justify-content:center;
                align-items:center;
                flex-direction:column;
                font-family:sans-serif;
            ">
                <h2>Processing your order...</h2>
                <p>Please wait, do not refresh</p>
            </div>
        `;

        var form = document.createElement("form");
        form.method = "POST";
        form.action = "{% url 'payment_success' %}";

        // CSRF
        var csrf = document.createElement("input");
        csrf.type = "hidden";
        csrf.name = "csrfmiddlewaretoken";
        csrf.value = "{{ csrf_token }}";

        // PAYMENT ID
        var payment_id = document.createElement("input");
        payment_id.type = "hidden";
        payment_id.name = "razorpay_payment_id";
        payment_id.value = response.razorpay_payment_id;

        // ADDRESS ID
        var address_id = document.createElement("input");
        address_id.type = "hidden";
        address_id.name = "address_id";
        address_id.value = "{{ request.session.address_id }}";

        form.appendChild(csrf);
        form.appendChild(payment_id);
        form.appendChild(address_id);

        document.body.appendChild(form);
        form.submit();
    },

    "theme": {
        "color": "#ff4d6d"
    }
};

// ✅ INIT RAZORPAY
var rzp = new Razorpay(options);

// ✅ OPEN PAYMENT
document.getElementById("pay-btn").onclick = function(e){
    rzp.open();
    e.preventDefault();
};

// ❌ PAYMENT FAILED
rzp.on('payment.failed', function (response){

    alert("Payment Failed ❌");

    console.log(response.error);

    window.location.href = "/checkout/";
});
</script>

</body>
</html>
