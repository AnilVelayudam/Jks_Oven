{% extends "base.html" %}
{% block content %}

<div style="max-width:400px;margin:auto;background:white;padding:30px;border-radius:10px;">

<h2 style="text-align:center;">Login</h2>

<form method="post">
    {% csrf_token %}
    
    {{ form.as_p }}

    <button type="submit" style="width:100%;padding:10px;background:#0e7490;color:white;border:none;">
        SIGN IN
    </button>

</form>

<hr>

<p style="text-align:center;">
    New customer?
</p>

<div style="text-align:center;">
    <a href="{% url 'register' %}" 
       style="background:#16a34a;color:white;padding:10px 20px;text-decoration:none;border-radius:5px;">
       Create Account
    </a>
</div>
</div>
{% endblock %}
