{% extends "base.html" %}
{% block content %}

<div class="auth-container">
    <div class="auth-box">

        <h2>Reset Password 🔒</h2>

        {% if form.errors %}
            <div class="alert-box">Password error. Try again.</div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="auth-btn">Reset Password</button>
        </form>

    </div>
</div>

{% endblock %}
